<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>404 - الصفحة غير موجودة</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Cairo,sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#1e293b;
            padding:40px;
            border-radius:20px;
            text-align:center;
            width:420px;
            box-shadow:0 20px 50px rgba(0,0,0,.35);
        }

        h1{
            font-size:90px;
            color:#3b82f6;
            margin-bottom:10px;
        }

        h2{
            margin-bottom:15px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:25px;
        }

        a{
            display:inline-block;
            padding:12px 25px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:10px;
            transition:.3s;
        }

        a:hover{
            background:#1d4ed8;
        }
    </style>

</head>

<body>

<div class="card">

    <h1>404</h1>

    <h2>الصفحة غير موجودة</h2>

    <p>الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>

    <a href="/">العودة للرئيسية</a>

</div>

</body>
</html>
